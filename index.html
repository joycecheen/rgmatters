<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- @include head.html -->
    <title>ROENTGEN MATTERS — Home</title>
    <script>
      // Hero load-in: hide the hero before first paint; src/scripts/hero-intro.js plays it.
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('has-intro');
      }
    </script>
  </head>
  <body>
    <!-- @include header.html {"page":"home"} -->

    <main id="main">
      <section class="home-hero">
        <div class="container home-hero__layout">
          <div>
            <h1 class="display home-hero__title" data-intro-title>
              We invent, develop, and provide proprietary hybrid materials for
              <span class="nowrap">next-generation</span> radiation scintillation and detection.
            </h1>
            <p class="lead home-hero__subtitle">
              Advancing security, safety, nuclear medicine, non-destructive testing, imaging, and high energy
              science.
            </p>
            <div class="home-hero__actions">
              <a href="/technology.html" class="button button--primary">
                Our Technology
                <!-- @icon arrow-right -->
              </a>
              <a href="/products.html" class="button button--secondary">Our Products</a>
            </div>
          </div>

          <div class="home-hero__visual">
            <canvas aria-hidden="true" data-hero-visual></canvas>
          </div>
        </div>
      </section>
    </main>

    <!-- @include footer.html -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
