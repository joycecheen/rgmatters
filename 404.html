<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROENTGEN MATTERS — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      display:grid;place-items:center;padding:24px;
      font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      color:#2b3d46;background:#fff;-webkit-font-smoothing:antialiased;text-align:center;
      background-image:
        linear-gradient(to right,rgba(0,126,164,.07) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(0,126,164,.07) 1px,transparent 1px);
      background-size:56px 56px;
    }
    body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.4),#fff 70%);z-index:-1}
    .container{max-width:560px;display:grid;justify-items:center;gap:24px}
    .mark{width:56px;height:auto}
    h1{margin:0;font-size:clamp(2.25rem,6vw,3.25rem);line-height:1.05;letter-spacing:-.035em;font-weight:600;color:#0b1c24}
    p{margin:0;font-size:1.125rem;line-height:1.6;color:#566a73}
    .btn{display:inline-flex;align-items:center;height:50px;padding:0 24px;margin-top:8px;border-radius:999px;background:#007EA4;color:#fff;text-decoration:none;font-weight:500;font-size:.9375rem;transition:background .2s}
    .btn:hover{background:#00668a}
    .btn:focus-visible{outline:2px solid #007EA4;outline-offset:3px}
  </style>
</head>
<body>
  <div class="container">
    <img class="mark" src="/logo-mark.png" alt="" width="209" height="234">
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist. Please check the URL or navigate back to our homepage.</p>
    <a href="index.html" class="btn">Go to Homepage</a>
  </div>
</body>
</html>
